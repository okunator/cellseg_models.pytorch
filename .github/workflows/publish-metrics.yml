name: Publish metrics to PyPI

on:
  release:
    types: [published]
  # Manual runs validate both artifacts without publishing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'metrics-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          cache-dependency-glob: uv.lock
      - name: Check metrics release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python tools/check_release_metadata.py --metrics
      - name: Test release guards
        run: uv run --no-project python -m unittest discover -s tools/tests -v
      - name: Build and check metrics distributions
        run: |
          uv build --package cellseg-metrics --out-dir metrics-dist
          uvx --from twine==6.2.0 twine check --strict metrics-dist/*
      - name: Preserve metrics distributions
        uses: actions/upload-artifact@v7
        with:
          name: metrics-distributions
          path: metrics-dist/*
          if-no-files-found: error

  install:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: metrics-distributions
          path: metrics-dist
      - name: Check clean wheel and source installations
        run: |
          cp -R packages/metrics/tests "$RUNNER_TEMP/metrics-tests"
          for distribution in wheel sdist; do
            python -m venv "$RUNNER_TEMP/metrics-$distribution"
            metrics_python="$RUNNER_TEMP/metrics-$distribution/bin/python"
            if [ "$distribution" = wheel ]; then
              "$metrics_python" -m pip install "$GITHUB_WORKSPACE"/metrics-dist/*.whl
            else
              "$metrics_python" -m pip install "$GITHUB_WORKSPACE"/metrics-dist/*.tar.gz
            fi
            "$metrics_python" -m pip check
            cd "$RUNNER_TEMP"
            "$metrics_python" - <<'PY'
          from importlib.metadata import distributions
          from pathlib import Path
          import sys
          import cellseg_metrics

          names = {package.metadata['Name'].lower().replace('_', '-') for package in distributions()}
          assert names - {'pip', 'setuptools', 'wheel'} == {'cellseg-metrics', 'numpy', 'scipy'}, names
          assert Path(cellseg_metrics.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          PY
            "$metrics_python" -m pip install 'pytest>=9.1.1'
            "$metrics_python" -m pytest --confcutdir="$RUNNER_TEMP/metrics-tests" "$RUNNER_TEMP/metrics-tests" -q
          done

  publish:
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'metrics-v')
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cellseg-metrics
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified metrics distributions
        uses: actions/download-artifact@v8
        with:
          name: metrics-distributions
          path: dist
      - name: Publish verified metrics distributions
        uses: pypa/gh-action-pypi-publish@release/v1
