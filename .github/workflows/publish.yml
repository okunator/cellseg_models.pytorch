name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs never publish the package; docs deployment is opt-in.
  workflow_dispatch:
    inputs:
      deploy_docs:
        description: Deploy documentation after validation (no package publication)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/tests.yml

  publish:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cellseg-models-pytorch
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: package-distributions
          path: dist

      # The standalone package has its own publisher and must be released first.
      - name: Require the standalone metrics release on PyPI
        run: >-
          python -m pip download --index-url https://pypi.org/simple
          --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/metrics-release"
          'cellseg-metrics>=0.1.0'

      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    if: >-
      !cancelled() && needs.validate.result == 'success' &&
      ((github.event_name == 'release' && !github.event.release.prerelease &&
        needs.publish.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_docs))
    needs: [validate, publish]
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
