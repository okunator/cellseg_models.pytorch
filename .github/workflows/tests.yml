name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.2.1"
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup-python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: poetry.lock

      - name: Install Poetry
        run: python -m pip install "poetry==$POETRY_VERSION"

      # Always synchronize dependencies and reinstall the package under review.
      - name: Install dependencies and current package
        run: poetry sync --no-interaction --all-extras

      - name: Run tests
        env:
          NUMBA_DISABLE_JIT: "1"
          HF_HUB_OFFLINE: "1"
        run: poetry run pytest --cov cellseg_models_pytorch/ --cov-report xml --junitxml=test-results.xml

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn

      - name: Verify coverage was generated
        run: test -s coverage.xml

      # Fork PRs have no repository secrets; their reports remain in artifacts.
      # An upload outage must not invalidate passing tests.
      - name: Upload coverage
        if: matrix.python-version == '3.10' && github.event_name == 'push'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  packages:
    uses: ./.github/workflows/package.yml
