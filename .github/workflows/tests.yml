name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NO_ALBUMENTATIONS_UPDATE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      # Always synchronize dependencies and reinstall the package under review.
      - name: Install dependencies and current package
        run: uv sync --locked --all-extras

      - name: Check strict library typing
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync mypy cellseg_models_pytorch/utils/convolve.py
          cellseg_models_pytorch/wsi/inst_merger.py

      - name: Build docs from reviewed notebook outputs
        if: matrix.python-version == '3.11'
        env:
          NUMBA_DISABLE_JIT: "1"
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: |
          uv sync --locked --group docs
          uv run --no-sync sphinx-build -W --keep-going -b html docs "$RUNNER_TEMP/docs-html"

      - name: Run tests
        env:
          NUMBA_DISABLE_JIT: "1"
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync pytest --cov cellseg_models_pytorch/ --cov-report xml --junitxml=test-results.xml

      - name: Check numerical helpers with Numba JIT enabled
        env:
          NUMBA_DISABLE_JIT: "0"
          NUMBA_NUM_THREADS: "2"
          HF_HUB_OFFLINE: "1"
        run: >-
          uv run --no-sync pytest cellseg_models_pytorch/utils/tests/test_geospatial_io.py
          cellseg_models_pytorch/transforms/tests/test_inst_transforms.py
          cellseg_models_pytorch/postproc/tests/test_postproc.py

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: warn

      - name: Verify coverage was generated
        run: test -s coverage.xml

      # Fork PRs have no repository secrets; their reports remain in artifacts.
      # An upload outage must not invalidate passing tests.
      - name: Upload coverage
        if: matrix.python-version == '3.10' && github.event_name == 'push'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  packages:
    uses: ./.github/workflows/package.yml

  onnx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch-version: "2.13.0"
            torchvision-version: "0.28.0"
          - torch-version: "2.14.1"
            torchvision-version: "0.29.1"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          cache-dependency-glob: |
            uv.lock
            tools/onnx-requirements.txt

      - name: Install locked baseline
        run: uv sync --locked --all-extras

      # Only this optional compatibility job overrides the locked PyTorch pair.
      - name: Install CPU exporter and optional test packages
        env:
          TORCH_VERSION: ${{ matrix.torch-version }}
          TORCHVISION_VERSION: ${{ matrix.torchvision-version }}
        run: |
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch==$TORCH_VERSION+cpu" "torchvision==$TORCHVISION_VERSION+cpu"
          uv pip install -r tools/onnx-requirements.txt
          uv pip check

      - name: Run ONNX Runtime comparisons and exporter regressions
        env:
          NUMBA_DISABLE_JIT: "1"
          HF_HUB_OFFLINE: "1"
          OMP_NUM_THREADS: "2"
        run: |
          uv run --no-sync python -c "import onnx, onnxscript, onnxruntime"
          uv run --no-sync pytest cellseg_models_pytorch/models/tests/test_cellpose_onnx.py cellseg_models_pytorch/models/tests/test_stardist_onnx.py -k 'not pretrained' --junitxml=onnx-results.xml
          uv run --no-sync python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = ET.parse("onnx-results.xml").findall(".//testcase")
          assert cases and not any(case.find("skipped") is not None for case in cases)
          for family in ("cellpose", "stardist"):
              assert sum(case.attrib["name"].startswith(f"test_{family}_onnxruntime_matches_pytorch") for case in cases) == 2
          PY

      - name: Preserve ONNX test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onnx-reports-${{ matrix.torch-version }}
          path: onnx-results.xml
          if-no-files-found: warn

  developer_checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
          cache-dependency-glob: uv.lock
      - name: Install locked developer tools
        run: uv sync --locked --only-group dev
      - name: Check release tooling
        run: |
          uv run --no-sync ruff check tools
          uv run --no-sync ruff format --check tools
          uv run --no-sync mypy tools/check_release_metadata.py
          uv run --no-sync python -m unittest discover -s tools/tests -v
