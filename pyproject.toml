[tool.poetry]
name = "cellseg_models_pytorch"
version = "0.1.30"
description = "Python library for 2D cell/nuclei instance segmentation models written with PyTorch."
authors = ["Okunator <oskari.lehtonen@helsinki.fi>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/okunator/cellseg_models.pytorch"
repository = "https://github.com/okunator/cellseg_models.pytorch"
keywords = [
    "cell segmentation",
    "nuclei segmentation",
    "pytorch",
    "pytorch-lightning",
]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24"
timm = "^1.0.7"
numba = "^0.60.0"
torch = ">=2.0.0,<3.0.0"
scipy = "^1.14"
scikit-image = "^0.25"
opencv-python = "^4.8"
tqdm = "^4.64.0"
scikit-learn = "^1.3.0"
requests = ">=2.33.0,<3"
# Security floors for HTTP and checkpoint-cache dependencies.
urllib3 = ">=2.8.0,<3"
idna = ">=3.15,<4"
filelock = ">=3.20.3,<4"
geopandas = ">=1.1.2,<2"
pyarrow = ">=23.0.1,<24"
rasterio = "^1.4.3"
libpysal = "^4.12.1"
mpire = {extras = ["dill"], version = "^2.10.2"}
pillow = ">=12.3.0,<13"
huggingface-hub = ">=0.34.4,<3"
safetensors = ">=0.6.2,<1"
pandas = ">=2.3.1,<4"
shapely = ">=2.1.1,<3"
networkx = ">=3.4.2,<4"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
pre-commit = ">=4.6.2,<5"
virtualenv = ">=21.7.13,<22"
matplotlib = ">=3.10.9,<3.11"
fonttools = ">=4.60.2,<5"
mypy = ">=2.4.0,<3"
ruff = "==0.17.0"
tomli = ">=2.2.1,<3"
scriv = { extras = ["toml"], version = ">=1.8.0,<2" }

[tool.scriv]
format = "md"
version = "literal: cellseg_models_pytorch/__init__.py: __version__"

[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = "-ra -v"
markers = ["cuda (deselect with '-m \"nocuda\"')"]

[tool.coverage.run]
source = ["cellseg_models_pytorch"]

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py", "*/albu_transforms/*", "*/legacy/*", "*/file_manager.py"]
exclude_lines = [
    "raise TypeError",
    "raise ImportError",
    "raise NotImplementedError",
    "raise ZeroDivisionError",
    "raise ValueError",
    "raise IOError",
    "except ImportError",
    "except TypeError",
    "except Exception",
    "def extra_repr",
]

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-include = ["*.ipynb"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "conftest.py",
    "old",
    "test",
    "tests",
    "__pypackages__",
    "__pycache__",
    "_build",
    "docs",
    "source",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# format docs
docstring-code-format = true

# docstr code line length
# docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
files = ["tools/check_release_metadata.py"]
strict = true
