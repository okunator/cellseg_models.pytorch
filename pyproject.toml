[project]
name = "cellseg_models_pytorch"
version = "0.1.30"
description = "Python library for 2D cell/nuclei instance segmentation models written with PyTorch."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Okunator", email = "oskari.lehtonen@helsinki.fi"}]
requires-python = ">=3.10,<4.0,!=3.14.1"
keywords = ["cell segmentation", "nuclei segmentation", "pytorch", "pytorch-lightning"]
dependencies = [
    "numpy>=2.2.6,<2.6",
    "timm>=1.0.30,<2",
    "numba>=0.68.0,<0.69",
    "torch>=2.13.0,<3.0.0",
    "torchvision>=0.28.0,<0.30",
    "scipy>=1.15.3,<2",
    "scikit-image>=0.25.2,<0.27",
    "opencv-python-headless>=4.14.0,<5",
    "tqdm>=4.64.0,<5",
    "scikit-learn>=1.7.2,<2",
    "requests>=2.33.0,<3",
    # Requests downloader requirements permit older HTTP/hostname packages.
    "urllib3>=2.8.0,<3",
    "idna>=3.15,<4",
    # Hub/PyTorch permit older locks, including the soft-lock cache fallback.
    "filelock>=3.20.3,<4",
    "geopandas>=1.1.2,<2",
    "pyarrow>=23.0.1,<24",
    "rasterio>=1.4.3,<2",
    "libpysal>=4.12.1,<5",
    "mpire[dill]>=2.10.2,<3",
    "pillow>=12.3.0,<13",
    "huggingface-hub>=0.34.4,<3",
    "safetensors>=0.6.2,<1",
    "pandas>=2.3.1,<4",
    "shapely>=2.1.1,<3",
    "networkx>=3.4.2,<4",
]

[project.urls]
Homepage = "https://github.com/okunator/cellseg_models.pytorch"
Repository = "https://github.com/okunator/cellseg_models.pytorch"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "pytest-xdist>=3.8.0,<4",
    "pre-commit>=4.6.2,<5",
    "virtualenv>=21.7.13,<22",
    "matplotlib>=3.10.9,<3.11",
    "fonttools>=4.60.2,<5",
    "mypy>=2.4.0,<3",
    "ruff==0.17.0",
    "tomli>=2.2.1,<3",
    "scriv[toml]>=1.8.0,<2",
]
docs = [
    "albumentations==2.0.8",
    "matplotlib>=3.10.9,<3.11",
    "myst-nb>=1,<2",
    "openslide-bin>=4.0.1.2,<5",
    "openslide-python>=1.4.6,<2",
    "polars>=1.44.2,<2",
    "pydata-sphinx-theme>=0.16,<1",
    "sphinx>=8,<9",
]

[tool.uv]
required-version = "==0.11.4"

[tool.scriv]
format = "md"
version = "literal: cellseg_models_pytorch/__init__.py: __version__"

[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = "-ra -v"
markers = ["cuda (deselect with '-m \"nocuda\"')"]

[tool.coverage.run]
source = ["cellseg_models_pytorch"]

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py", "*/albu_transforms/*", "*/legacy/*", "*/file_manager.py"]
exclude_lines = [
    "raise TypeError",
    "raise ImportError",
    "raise NotImplementedError",
    "raise ZeroDivisionError",
    "raise ValueError",
    "raise IOError",
    "except ImportError",
    "except TypeError",
    "except Exception",
    "def extra_repr",
]

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-include = ["*.ipynb"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "conftest.py",
    "old",
    "test",
    "tests",
    "__pypackages__",
    "__pycache__",
    "_build",
    "docs",
    "source",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# format docs
docstring-code-format = true

# docstr code line length
# docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.poetry]
# Build-backend file selection only; project metadata and installs use uv.
exclude = ["cellseg_models_pytorch/**/tests"]

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
files = ["tools/check_release_metadata.py", "cellseg_models_pytorch/utils/convolve.py"]
strict = true
