[project]
name = "cellseg_models_pytorch"
version = "0.2.0"
description = "Python library for 2D cell/nuclei instance segmentation models written with PyTorch."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Okunator", email = "oskari.lehtonen@helsinki.fi"}]
requires-python = ">=3.11,<4.0,!=3.14.1"
keywords = ["cell segmentation", "nuclei segmentation", "pytorch", "pytorch-lightning"]
dependencies = [
    "cellseg-metrics>=0.1.0",
    "numpy>=2.2.6",
    "timm>=1.0.30",
    "numba>=0.68.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "scipy>=1.15.3",
    "scikit-image>=0.25.2",
    "opencv-python-headless>=5.0.0.93",
    "tqdm>=4.70.1",
    "scikit-learn>=1.7.2",
    "geopandas>=1.1.4",
    "pyarrow>=25.0.1",
    "rasterio>=1.4.4",
    "libpysal>=4.13.0",
    "mpire[dill]>=2.10.2",
    "pillow>=13.0.0",
    "huggingface-hub>=2.2.0",
    "safetensors>=0.8.0",
    "pandas>=2.3.3",
    "shapely>=2.1.2",
    "networkx>=3.4.2",
]

[project.optional-dependencies]
training = ["albumentations>=2.0.8", "tables>=3.11.1"]
onnx = ["onnx>=1.23.2", "onnxscript>=0.7.2"]
openslide = ["openslide-python>=1.4.6", "openslide-bin>=4.0.1.2"]

[project.urls]
Documentation = "https://okunator.github.io/cellseg_models.pytorch/"
Homepage = "https://github.com/okunator/cellseg_models.pytorch"
Repository = "https://github.com/okunator/cellseg_models.pytorch"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pre-commit>=4.6.2",
    "virtualenv>=21.14.11",
    "matplotlib>=3.10.9",
    "fonttools>=4.65.0",
    "mypy>=2.4.0",
    "ruff==0.17.0",
    "tomli>=2.5.0",
    "scriv[toml]>=1.8.0",
    "types-geopandas>=1.1.4.20261006",
    "types-networkx>=3.6.1.20261018",
    "types-shapely>=2.1.0.20260728",
]
docs = [
    "albumentations>=2.0.8",
    "matplotlib>=3.10.9",
    "myst-nb>=1.4.0",
    "openslide-bin>=4.0.1.2",
    "openslide-python>=1.4.6",
    "polars>=2.0.0",
    "pydata-sphinx-theme>=0.19.0",
    "requests>=2.34.2",
    "sphinx>=8.1.3",
]

[tool.uv]
required-version = "==0.11.4"

[tool.uv.workspace]
members = ["packages/metrics"]

[tool.uv.sources]
cellseg-metrics = { workspace = true }

[tool.scriv]
format = "md"
version = "literal: cellseg_models_pytorch/__init__.py: __version__"

[tool.pytest.ini_options]
minversion = "9.1.1"
addopts = "-ra -v"
markers = ["cuda (deselect with '-m \"nocuda\"')"]

[tool.coverage.run]
source = ["cellseg_models_pytorch"]

[tool.coverage.report]
omit = ["*/tests/*", "*/__init__.py", "*/albu_transforms/*", "*/legacy/*", "*/file_manager.py"]
exclude_lines = [
    "raise TypeError",
    "raise ImportError",
    "raise NotImplementedError",
    "raise ZeroDivisionError",
    "raise ValueError",
    "raise IOError",
    "except ImportError",
    "except TypeError",
    "except Exception",
    "def extra_repr",
]

[tool.ruff]
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-include = ["*.ipynb"]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "conftest.py",
    "old",
    "test",
    "tests",
    "__pypackages__",
    "__pycache__",
    "_build",
    "docs",
    "source",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.10
target-version = "py310"

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
select = ["E4", "E7", "E9", "F"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = ["B"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# format docs
docstring-code-format = true

# docstr code line length
# docstring-code-line-length = "dynamic"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.poetry]
# Build-backend file selection only; project metadata and installs use uv.
exclude = ["cellseg_models_pytorch/**/tests"]

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
files = [
    "tools/check_release_metadata.py",
    "cellseg_models_pytorch/utils/convolve.py",
    "cellseg_models_pytorch/wsi/inst_merger.py",
]
strict = true
